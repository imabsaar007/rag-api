services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot job: downloads the models into the shared volume, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull nomic-embed-text && ollama pull llama3.2"]
    restart: "no"

  api:
    build: .
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: nomic-embed-text
      LLM_MODEL: llama3.2
      STORE_BACKEND: memory
      MIN_SCORE: "0.5"
    ports:
      - "8000:8000"

  # Optional: use your C++ VectorDB instead of the in-memory store.
  # 1. Add a Dockerfile to that project and point `build` at it.
  # 2. Make sure its REST API matches the contract in ragapi/vectorstore.py
  #    (RemoteVectorDBStore), or adjust that class.
  # 3. Set STORE_BACKEND=vectordb and VECTORDB_URL=http://vectordb:8080 on `api`.
  #
  # vectordb:
  #   build: ../VectorDB
  #   ports:
  #     - "8080:8080"

volumes:
  ollama-data:
